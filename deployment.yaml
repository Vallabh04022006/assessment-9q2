apiVersion: apps/v1
kind: Deployment

metadata:
  name: bookstore-app

spec:
  replicas: 3

  selector:
    matchLabels:
      app: bookstore

  template:
    metadata:
      labels:
        app: bookstore

    spec:
      containers:
      - name: bookstore-container
        image: vallabh04022006/bookstore:v1
        ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service

metadata:
  name: bookstore-service

spec:
  type: NodePort

  selector:
    app: bookstore

  ports:
  - protocol: TCP
    port: 80
    targetPort: 80
    nodePort: 30080
